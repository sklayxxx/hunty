name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/critical-unit.mjs
      - run: cargo test -p hunty-core -p hunty-node
      - run: cargo build -p hunty-node
      - run: node tests/core.mjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo check -p hunty
