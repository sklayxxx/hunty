[package]
name = "hunty-iced"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hunty-core = { path = "../hunty-core" }
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "image-without-codecs"] }
image = { version = "0.24", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde_json = "1"
dirs = "6"
