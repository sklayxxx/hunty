[package]
name = "hunty-iced"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hunty-core = { path = "../hunty-core" }
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "image-without-codecs"] }
image = { version = "0.24", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
mime_guess = "2"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
gstreamer = { version = "0.22", optional = true }
gstreamer-app = { version = "0.22", optional = true }
gstreamer-video = { version = "0.22", optional = true }
tempfile = { version = "3", optional = true }
url = { version = "2", optional = true }

[features]
default = []
native-video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:tempfile", "dep:url"]
