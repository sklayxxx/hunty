[package]
name = "hunty-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hunty для Linux/macOS: P2P-узел + встроенный веб-интерфейс в браузере (и мост для тестов)"

[dependencies]
hunty-core = { path = "../hunty-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures = "0.3"
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
include_dir = "0.7"
base64 = "0.22"
