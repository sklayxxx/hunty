[workspace]
resolver = "2"
members = ["crates/hunty-core", "crates/hunty-node", "src-tauri"]
default-members = ["crates/hunty-core", "crates/hunty-node"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 1
