[workspace]
resolver = "2"
members = ["crates/hunty-core", "crates/hunty-node", "src-tauri"]
default-members = ["crates/hunty-core", "crates/hunty-node"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[profile.release]
# v0.5: полный LTO и одна единица кодогенерации — ядро быстрее и меньше (сборка в CI дольше, это ок)
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 1
