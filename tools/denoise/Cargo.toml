# Шумодав RNNoise (nnnoiseless, чистый Rust) → WebAssembly для AudioWorklet.
# Отдельный крейт (не в workspace): собирается редко, готовый ui/audio/denoise.wasm лежит в репо.
# Сборка: tools/denoise/build.sh  (нужен rustup target add wasm32-unknown-unknown)
[package]
name = "hunty-denoise"
version = "0.1.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
nnnoiseless = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
